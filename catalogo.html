<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Exclusivo de Perfumes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf8f5;
            --text-main: #1c1b1a;
            --text-light: #666;
            --gold: #d4af37;
            --gold-light: #e8d08c;
            --white: #ffffff;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }

        /* Hero Section */
        .hero {
            background-color: var(--text-main);
            color: var(--gold);
            padding: 80px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, rgba(28, 27, 26, 1) 70%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--gold-light);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--gold);
            color: var(--white);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
            border-radius: 6px;
            transition: var(--transition);
            border: 2px solid var(--gold);
            font-size: 0.95rem;
        }

        .download-btn:hover {
            background-color: transparent;
            color: var(--gold);
        }

        .download-btn svg {
            vertical-align: text-bottom;
            margin-right: 8px;
        }

        /* Controls Section */
        .controls-container {
            max-width: 1200px;
            margin: -30px auto 40px;
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-light);
            font-weight: 600;
        }

        input, select {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: var(--bg-color);
            transition: var(--transition);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        /* Stats */
        .stats {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        /* Catalog List */
        .catalog-container {
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 20px;
            overflow-x: auto;
        }

        table.perfume-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            min-width: 600px;
        }

        table.perfume-table thead {
            background-color: var(--text-main);
            color: var(--gold);
        }

        table.perfume-table th, table.perfume-table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        table.perfume-table th {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        table.perfume-table tbody tr {
            transition: var(--transition);
        }

        table.perfume-table tbody tr:hover {
            background-color: #fbf9f6;
        }

        .perfume-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .perfume-brand {
            font-size: 0.9rem;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .perfume-category {
            font-size: 0.8rem;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 1rem; }
            .controls-container {
                margin: 20px;
                grid-template-columns: 1fr;
            }
            table.perfume-table th, table.perfume-table td {
                padding: 12px 10px;
            }
        }
    </style>
</head>

        const tbody = document.getElementById('catalogBody');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const brandFilter = document.getElementById('brandFilter');
        const sortSelect = document.getElementById('sortSelect');
        const statsDisplay = document.getElementById('statsDisplay');

        // Initialize Dropdowns
        function initFilters() {
            const categories = [...new Set(perfumesData.map(p => p.Categoria))].sort();
            const brands = [...new Set(perfumesData.map(p => p.Grife))].sort();

            categories.forEach(cat => {
                let option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categoryFilter.appendChild(option);
            });

            brands.forEach(brand => {
                let option = document.createElement('option');
                option.value = brand;
                option.textContent = brand;
                brandFilter.appendChild(option);
            });
        }

        function renderList(data) {
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="no-results serif">Nenhum perfume encontrado com estes filtros.</td></tr>';
                statsDisplay.textContent = '0 perfumes';
                return;
            }

            statsDisplay.textContent = `Mostrando ${data.length} perfumes`;

            data.forEach(perfume => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="perfume-name">${perfume['Inspirado em']}</span></td>
                    <td><span class="perfume-brand">${perfume.Grife}</span></td>
                    <td><span class="perfume-category">${perfume.Categoria}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterAndSort() {
            const term = searchInput.value.toLowerCase();
            const cat = categoryFilter.value;
            const brand = brandFilter.value;
            const sort = sortSelect.value;

            // Filter
            let filtered = perfumesData.filter(p => {
                const matchSearch = p['Inspirado em'].toLowerCase().includes(term);
                const matchCat = cat === 'all' || p.Categoria === cat;
                const matchBrand = brand === 'all' || p.Grife === brand;
                return matchSearch && matchCat && matchBrand;
            });

            // Sort
            filtered.sort((a, b) => {
                if (sort === 'name_asc') return a['Inspirado em'].localeCompare(b['Inspirado em']);
                if (sort === 'name_desc') return b['Inspirado em'].localeCompare(a['Inspirado em']);
                if (sort === 'brand_asc') return a.Grife.localeCompare(b.Grife);
                if (sort === 'category_asc') return a.Categoria.localeCompare(b.Categoria);
                return 0;
            });

            renderList(filtered);
        }

        // Event Listeners
        searchInput.addEventListener('input', filterAndSort);
        categoryFilter.addEventListener('change', filterAndSort);
        brandFilter.addEventListener('change', filterAndSort);
        sortSelect.addEventListener('change', filterAndSort);

        // Initial Render
        initFilters();
        filterAndSort();

    </script>
